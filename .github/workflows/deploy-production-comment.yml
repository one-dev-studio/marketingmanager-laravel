name: Deploy production (issue comment)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

concurrency:
  group: deploy-production-comment
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.eval.outputs.proceed }}
    steps:
      - name: Evaluate deploy comment
        id: eval
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          USER_LOGIN: ${{ github.event.comment.user.login }}
          USER_TYPE: ${{ github.event.comment.user.type }}
        run: |
          proceed=false
          if [ "$ISSUE_TITLE" = "Marketing Manager production deploy" ]; then
            trimmed=$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if printf '%s' "$trimmed" | grep -Fq '/deploy marketingmanager production'; then
              if [ "$USER_LOGIN" = "andrew-za" ] && [ "$USER_TYPE" = "User" ]; then
                proceed=true
              fi
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  post-start-comment:
    needs: evaluate
    if: needs.evaluate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge production deploy
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Starting **production deploy** (SSH deploy).\nWorkflow run: ${runUrl}`,
            });

  deploy:
    needs: post-start-comment
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit

  notify-failure:
    needs: [evaluate, deploy]
    if: failure() && needs.evaluate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Production deploy **failed**.\nWorkflow run: ${runUrl}`,
            });
